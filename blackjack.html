<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/blackjack_style.css">
  <!-- Title of the webpage, displayed in the browser tab -->
  <title>Blackjack</title>
</head>

<body>
  <header class="container">
    <h1 id="game_title">Blackjack 25</h1>
  </header>

  <main class="container">
    <section id="game">
      <div class="money-panel" aria-label="Saldo e aposta">
        <p><strong>Saldo:</strong> <span id="balance">0,00 €</span></p>
        <label for="blackjack_version">Versão</label>
        <select id="blackjack_version">
          <option value="25" selected>Blackjack 25</option>
          <option value="21">Blackjack 21</option>
        </select>
        <label for="bet">Aposta (€)</label>
        <input id="bet" type="number" min="1" step="1" value="10" inputmode="numeric">
      </div>

      <div class="hand hand--dealer">
        <h2>Dealer <small class="score">Points: <span id="dealer_total">0</span></small></h2>
        <p id="dealer"></p>
      </div>

      <div class="hand hand--player">
        <h2>Player <small class="score">Points: <span id="player_total">0</span></small></h2>
        <p id="player"></p>
      </div>

      <div class="game-actions">
        <button class="btn btn-primary" id="card" type="button" onclick="playerNewCard()">Card</button>
        <button class="btn btn-secondary" id="stand" type="button" onclick="dealerFinish()">Stand</button>
        <button class="btn btn-success" id="new_game" type="button" onclick="newGame()" disabled>New Game</button>
      </div>
    </section>

    <section id="game_status">
    </section>
    <section id="stats_section" class="mt-4">
      <h2>Estatísticas</h2>
      <div id="stats" class="small">
        <p><strong>Vitórias:</strong> <span id="wins">0</span></p>
        <p><strong>Derrotas:</strong> <span id="losses">0</span></p>
        <p><strong>Empates:</strong> <span id="draws">0</span></p>
        <p><strong>Total de Partidas:</strong> <span id="total">0</span></p>
      </div>
    </section>
  </main>

  <footer class="container">
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0t3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <script src="js/blackjack_object.js"></script>
  <script src="js/blackjack_manager.js"></script>

  <script>
    window.onload = initializeGamePage;
  </script>
</body>

</html>
